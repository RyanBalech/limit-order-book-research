[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "limit-order-book-research"
version = "0.1.0"
description = "Reproducible market microstructure and limit order book research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]
ml = ["scikit-learn>=1.5,<2", "torch>=2.4,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
